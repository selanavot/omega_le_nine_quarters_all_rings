name: Palomar full mechanical preflight

# Manual only: the public-source prerequisite and substantial build cost make
# this unsuitable for automatic runs while this repository is private.
'on':
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Public, pushed, full 40-character commit to verify"
        required: true
        type: string
      authorization_relationship:
        description: "Human-confirmed relationship: maintainer or approved (see docs/PALOMAR.md)"
        required: true
        type: choice
        options:
          - "I am a responsible author or maintainer"
          - "I have approval from a responsible author or maintainer"
      request_id:
        description: "Twelve lowercase letters/digits identifying this preflight report"
        required: true
        default: ringsfull001
        type: string

permissions:
  contents: read

jobs:
  palomar:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.target_commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
